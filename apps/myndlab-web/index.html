<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- BEO-580: preconnect to critical third-party origins so DNS + TLS handshakes
         start before the JS bundle requests them. -->
    <link rel="preconnect" href="https://srflynvdrsdazxvcxmzb.supabase.co" crossorigin />
    <link rel="preconnect" href="https://beomz.ai" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- BEO-580: load DM Sans non-blocking. The print/onload swap means the
         stylesheet doesn't block render; the noscript fallback keeps users
         without JS rendering correctly. font-display=swap is in the URL so
         text remains visible during the (tiny) font fetch. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      />
    </noscript>

    <title>Myndlab</title>

    <!-- Minimal inline app shell. Renders before the JS bundle parses so users
         see a charcoal background + cyan M mark instead of a blank screen on
         hard refresh. The shell is removed once React mounts. -->
    <style>
      html, body { margin: 0; padding: 0; }
      body {
        background: #131313;
        font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #app-shell {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #131313;
        z-index: 9999;
        transition: opacity 200ms ease-out;
      }
      #app-shell.app-shell-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-shell .app-shell-mark {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-shell .app-shell-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg,
          #00D5D8 0deg,
          #FF2FB3 120deg,
          #FFF500 240deg,
          #00D5D8 360deg);
        -webkit-mask: radial-gradient(circle, transparent 27px, #000 28px, #000 30px, transparent 31px);
        mask: radial-gradient(circle, transparent 27px, #000 28px, #000 30px, transparent 31px);
        animation: app-shell-spin 1.5s linear infinite;
      }
      #app-shell .app-shell-prism {
        position: relative;
        width: 26px;
        height: 26px;
        z-index: 2;
      }
      #app-shell .app-shell-prism svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      @keyframes app-shell-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-shell .app-shell-ring { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app-shell" aria-hidden="true">
      <div class="app-shell-mark">
        <div class="app-shell-ring"></div>
        <div class="app-shell-prism">
          <svg viewBox="0 0 1733 1887" xmlns="http://www.w3.org/2000/svg">
            <path d="M1230.44 708.8L868.73 904.46L921.4 0L1230.44 708.8Z" fill="#fff"/>
            <path d="M480.69 634.72L658.57 746.48L919.23 0.149902L480.69 634.72Z" fill="#fff"/>
            <path d="M653.52 753.86L537.44 1066.63L0 1358.15L475.19 639.61L653.52 753.86Z" fill="#cfd2db"/>
            <path d="M819.8 1263.59L791.62 1610.3L3.85986 1377.27L550.88 1079.37L819.8 1263.59Z" fill="#cfd2db"/>
            <path d="M1728.91 1886.38L800.15 1612.06L828.69 1268.21L1728.91 1886.38Z" fill="#fff"/>
            <path d="M1732.59 1878.32L872.46 916.19L1236.9 719.08L1242.41 731.7L1732.59 1878.32Z" fill="#fff"/>
          </svg>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
